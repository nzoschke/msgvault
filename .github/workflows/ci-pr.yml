name: CI

# Use this fork's workflow so its runner and build settings are exercised.
on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    cache-mode: read
    uses: ./.github/workflows/ci.yml

  released-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: kenn-io/actions/release-commands@main
        with:
          # These documents and installers describe the upstream release.
          repository: kenn-io/msgvault
          files: |
            README.md
            scripts/install.sh
            scripts/install.ps1
          binaries: msgvault
          asset: msgvault_*[0-9]_linux_amd64.tar.gz

  gate:
    name: CI gate
    needs: [run, released-commands]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Check CI result
        if: needs.run.result != 'success' || needs.released-commands.result != 'success'
        run: exit 1
