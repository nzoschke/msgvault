name: External Gmail release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to build
        required: true
        type: string
  push:
    tags: ['v*-hc.*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            image: ''
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: ubuntu:22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    container:
      image: ${{ matrix.image }}
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4

      - name: Install build tools
        if: matrix.arch == 'arm64'
        run: |
          kit-retry 3 5 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          kit-retry 3 5 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y gcc g++ git curl tar gzip make unzip libsqlite3-dev ca-certificates
      - name: Verify build environment
        run: |
          . /etc/os-release
          test "$VERSION_ID" = 22.04
          for tool in gcc g++ git curl tar gzip make unzip; do command -v "$tool"; done
          test -f /usr/include/sqlite3.h
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.version || github.ref_name }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.21.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install Go
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(awk '/^go / {print $2}' go.mod)
          kit-download "https://go.dev/dl/go${version}.linux-${ARCH}.tar.gz" /tmp/go.tar.gz
          mkdir -p "$RUNNER_TEMP/msgvault-go"
          tar -C "$RUNNER_TEMP/msgvault-go" -xzf /tmp/go.tar.gz
          echo "$RUNNER_TEMP/msgvault-go/go/bin" >> "$GITHUB_PATH"
      - name: Build and test archive
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/build-vault-release.sh "$RELEASE_VERSION"
          GOWORK=off go test -tags 'fts5 sqlite_vec' ./cmd/msgvault/cmd ./internal/sync ./internal/gmail ./internal/api ./internal/store ./internal/daemonclient \
            -run 'Test(StandardExternal|SetupExternalGmail|SetupExternalMSMail|AddO365GraphExternal|MessageTagsMicrosoft|SyncMicrosoft|MigrateSourceIdentity|DecodeOutlookMigration|ExternalSharedClient|QueryBackfill|External|InitialBackfill|Full.*(Cancel|Resume)|.*(ImportMessages|MessageImport|SyncRunResults|SyncOperation|CLISyncOperation))' -count=1
          GOWORK=off go test -tags 'fts5 sqlite_vec' ./internal/msgraph ./internal/msmail -count=1
          mkdir dist/unpacked
          tar -xzf dist/*.tar.gz -C dist/unpacked
          scripts/smoke-vault-release.sh dist/unpacked/msgvault
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_VERSION" *.tar.gz SHA256SUMS --verify-tag --prerelease --latest=false --title "$RELEASE_VERSION" --notes 'Linux CLI and daemon binaries with externally authenticated Gmail and Microsoft Graph mail sync, native Outlook category observation, bounded initial backfills with --after, and interrupted-sync recovery. Built from the tagged source on Ubuntu 22.04 for amd64 and arm64. Includes successful-message sync results, caller-supplied sync operation IDs, email projections and document imports, the embedded browser application, and default-off semantic search through authenticated embedding proxies.'
